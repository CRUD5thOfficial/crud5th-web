<title id="title">確認記録と次の対応を継続する</title><desc id="desc">月次の確認レポートとWeek01から04の予定表。対象の範囲、取出し条件、変更の有無、要確認事項を次の対応へつなぐ説明用サンプル。実績数や成功率は示していません。</desc>
